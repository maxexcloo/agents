# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update TerraShark Revision
pipelineid: update-terrashark-revision
labels:
  group: custom
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/LukasNiessen/terrashark.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  submodule:
    kind: shell
    disablesourceinput: true
    spec:
      command: |-
        set -eu
        revision='{{ source "version" }}'
        current=$(git -C skills/terrashark rev-parse HEAD)
        if [ "$revision" != "$current" ]; then
          git -C skills/terrashark fetch --depth 1 origin "$revision"
          git -C skills/terrashark checkout --detach "$revision"
          printf '%s -> %s\n' "$current" "$revision"
        fi
      changedif:
        kind: console/output
      environments:
        - name: PATH
        - name: HOME
